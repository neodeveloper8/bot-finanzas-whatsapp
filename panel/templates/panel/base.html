<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block titulo %}Mis finanzas{% endblock %}</title>
<style>
  /* Pantallas simples del acceso. El panel en sí será la app de React (fase 3). */
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#FFFFFF;color:#2F2E2B;font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .caja{width:100%;max-width:400px;padding:32px 28px;display:flex;flex-direction:column;gap:20px}
  .icono{width:52px;height:52px;border-radius:12px;background:#F7F7F5;border:1px solid #E9E9E7;
         display:flex;align-items:center;justify-content:center;color:#4A4945}
  h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
  p{margin:0;color:#5F5E5A}
  .nota{font-size:13px;color:#6B6A66}
  .comando{display:flex;align-items:center;gap:10px;border:1px solid #E9E9E7;border-radius:10px;
           padding:14px 16px;background:#F7F7F5;color:#5F5E5A}
  code{font:15px ui-monospace,SFMono-Regular,Menlo,monospace;background:#FFFFFF;border:1px solid #E1E1DE;
       border-radius:5px;padding:2px 8px;color:#2F2E2B}
  .boton{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border:0;
         border-radius:8px;background:#2F2E2B;color:#FFFFFF;font:600 15px/1 inherit;cursor:pointer;text-decoration:none}
  .boton:hover{background:#000000}
  .boton.secundario{background:#FFFFFF;color:#2F2E2B;border:1px solid #E1E1DE}
  .boton.secundario:hover{background:#F7F7F5}
</style>
</head>
<body>
<main class="caja">
{% block contenido %}{% endblock %}
</main>
</body>
</html>
