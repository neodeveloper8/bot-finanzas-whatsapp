# Copiar a /etc/nginx/sites-available/botfin y reemplazar TU-SUBDOMINIO.
# Arranca solo con HTTP (puerto 80): certbot agrega el bloque HTTPS automáticamente.
server {
    listen 80;
    listen [::]:80;
    server_name TU-SUBDOMINIO.duckdns.org;

    # Meta solo manda JSON chiquito; nadie tiene por qué subir archivos grandes aquí
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Así Django sabe que la petición original era HTTPS (SECURE_PROXY_SSL_HEADER)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
